site_name: Daft 用户指导手册
site_description: 面向生产使用的 Daft on Ray 架构、原理、最佳实践与运维调参手册
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
nav:
  - 首页: index.md
  - 1. 架构: 01-architecture.md
  - 2. 执行模型: 02-execution-model.md
  - 3. KubeRay RayJob 部署: 03-deploy-kuberay.md
  - 4. Partition: 04-partition.md
  - 5. Morsel 与 into_batches: 05-morsel-batch.md
  - 6. UDF: 06-udf.md
  - 7. 读写参数: 07-io-config.md
  - 8. 日志与监控: 08-observability.md
  - 9. 资源与调参: 09-tuning-runbook.md
  - 10. 生产禁区: 10-production-donts.md
