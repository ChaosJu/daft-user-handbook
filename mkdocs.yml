site_name: Daft 用户指导手册
site_description: 面向生产使用的 Daft on Ray 架构、原理、最佳实践与运维调参手册
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
nav:
  - 首页: index.md
  - 1. 架构: 01-architecture.md
  - 2. 执行模型: 02-execution-model.md
  - 3. KubeRay RayJob 部署: 03-deploy-kuberay.md
  - 4. Partition: 04-partition.md
  - 5. UDF: 05-udf.md
  - 6. 读写参数: 06-io-config.md
  - 7. 日志与监控: 07-observability.md
  - 8. 资源与调参: 08-tuning-runbook.md
  - 9. 生产禁区: 09-production-donts.md
