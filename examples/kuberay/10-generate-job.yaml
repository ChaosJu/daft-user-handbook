# ============================================================================
# 数据生成 Job
#
# 由原 deploy/k8s/kuberay/20-generate-job.yaml 改造，只改了编号（生成在
# RayJob 之前跑）和末尾的提示语。**内容本身不需要改造成 RayJob**：
#
#   generate 是单线程的（每个 clip 一次 ffmpeg + 一次 upload），只依赖 MinIO，
#   不需要 Ray。用 RayJob 包一层等于为一个单进程任务拉起整个 Ray 集群。
#   普通 batch/v1 Job 是对的形态。
#
# 这也是改造时的一条判据：只有真正需要分布式执行的步骤才值得做成 RayJob。
#
# 流程：
#   1. 只等 MinIO（Ray / mock-llm 都不需要）
#   2. ffmpeg 转码 + 上传到 s3://benchmark/audio/<GEN_RUN_ID>/
#
# 产物：
#   s3://benchmark/audio/<GEN_RUN_ID>/manifest.parquet
#   s3://benchmark/audio/<GEN_RUN_ID>/input/<doc_id>
#
# 10k 个 clip 大约 1–3 小时。复跑同一份数据集应该跳过这个 Job，
# 直接把 20-rayjob.yaml 的 DATA_RUN_ID 指到已有的 GEN_RUN_ID。
#
# 重跑：
#   kubectl delete job bench-generate -n daft-bench --ignore-not-found
#   kubectl apply -f examples/kuberay/10-generate-job.yaml
#   kubectl logs -n daft-bench job/bench-generate -f
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-generate
  namespace: daft-bench
  labels:
    app: bench-generate
spec:
  backoffLimit: 0
  # 10k × 30s 的串行生成。GEN_COUNT 调大时要同步放大。
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels: { app: bench-generate }
      annotations:
        kubectl.kubernetes.io/default-container: generator
    spec:
      restartPolicy: Never
      # imagePullSecrets:
      #   - name: offline-registry
      initContainers:
        - name: wait-deps
          image: daft-audio:offline
          imagePullPolicy: IfNotPresent
          # 显式走 venv。登录 shell（bash -l）在 python:3.12-slim 里会重置 PATH，
          # 结果命中 /usr/local/bin/python。
          command: ["/opt/venv/bin/python", "/scripts/wait.py", "minio"]
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      containers:
        - name: generator
          image: daft-audio:offline
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: bench-env }
            - secretRef: { name: minio-creds }
          env:
            - name: GEN_COUNT
              value: "10000"
            # 留空则自动命名 bench-<UTC>。写死某个 id 会覆盖 MinIO 里
            # 同 bucket/prefix 下的那份数据。
            - name: GEN_RUN_ID
              value: ""
          # 不要加 -l：会重置 Docker 的 PATH 并把 /opt/venv 藏起来。
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              GEN_RUN_ID="${GEN_RUN_ID:-bench-$(date -u +%Y%m%dT%H%M%SZ)}"
              echo "=== GEN_RUN_ID=$GEN_RUN_ID GEN_COUNT=${GEN_COUNT:-10000} ==="
              /opt/venv/bin/python -m benchmark.audio generate \
                --run-id "$GEN_RUN_ID" \
                --profile fixed \
                --duration-s 30 \
                --count "${GEN_COUNT:-10000}" \
                --bucket benchmark \
                --prefix audio
              echo "=== manifest: s3://benchmark/audio/$GEN_RUN_ID/manifest.parquet ==="
              echo "=== next: 把 20-rayjob.yaml 的 entrypoint 里"
              echo "===       REPLACE_WITH_DATA_RUN_ID 换成 $GEN_RUN_ID ==="
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: bench-scripts }
