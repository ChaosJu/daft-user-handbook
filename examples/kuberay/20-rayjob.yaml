# ============================================================================
# RayJob —— 由 10-raycluster.yaml + 30-submit-job.yaml 合并改造而来
#
# 这个文件就是"改造成 RayJob 形态"的成果。对照关系：
#
#   原 10-raycluster.yaml  ──►  spec.rayClusterSpec        （集群规格整体内联）
#   原 30-submit-job.yaml  ──►  spec.entrypoint            （driver 命令行）
#                          ──►  spec.submitterPodTemplate  （依赖探针 + 提交器）
#   原 submit.py 里的 JobSubmissionClient / tail / 状态检查
#                          ──►  KubeRay 内置，不用再自己写
#
# 语义变化（这是选 RayJob 的理由，也是它的代价）：
#   集群随作业生死。跑完 shutdownAfterJobFinishes 删掉整个 RayCluster，
#   所以 head 上 /out 的产物必须在 driver 退出前推走 —— 这就是 entrypoint
#   走 run-bench.sh 而不是直接调 benchmark.audio run 的原因。
#
# 另一条路径：要连续调参、或者作业失败后想留着集群翻 /tmp/ray，
# 用 40-raycluster.yaml（常驻集群）+ 41-rayjob-existing.yaml
# （clusterSelector 打进去）。两条路抢同一批节点，不要同时 apply。
#
# 前置条件：
#   - KubeRay operator + CRD ≥ v1.6.2
#   - 已 apply 00-platform.yaml（namespace / bench-env / minio-creds /
#     bench-scripts / MinIO / mock-llm）
#   - 已 apply 10-generate-job.yaml，并拿到它打印的 GEN_RUN_ID
#   - 镜像 daft-audio:offline 可拉（Ray 2.55.1 + ray[default] + 离线模型）
#
# apply 前必做：把 entrypoint 里的 REPLACE_WITH_DATA_RUN_ID 换成 GEN_RUN_ID
#
# 提交与观察：
#   kubectl apply -f examples/kuberay/20-rayjob.yaml
#   kubectl get rayjob daft-audio-bench -n daft-bench -w
#   kubectl logs -n daft-bench -l ray.io/node-type=head -f     # driver 日志
#
# 重跑：RayJob 是一次性对象，改完必须先删再建
#   kubectl delete rayjob daft-audio-bench -n daft-bench --ignore-not-found
#   kubectl apply -f examples/kuberay/20-rayjob.yaml
# ============================================================================
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: daft-audio-bench
  namespace: daft-bench
  labels:
    app.kubernetes.io/name: daft-audio-bench
    app.kubernetes.io/component: rayjob
spec:
  # --------------------------------------------------------------------------
  # driver 命令行。KubeRay 会把它交给 Ray Jobs API，在 head 上执行。
  #
  # 为什么套一层 run-bench.sh：
  #   `benchmark.audio run --run-dir` 只写本地目录，而作业结束后 head Pod
  #   会被删掉。run-bench.sh 在 driver 退出前把 /out/<RUN_ID> 推到
  #   s3://benchmark/audio/<RUN_ID>/artifacts/。少了这一步，report.md 和
  #   resources.csv 会跟着 Pod 一起消失。
  #
  # ConfigMap 挂进来的 key 没有执行位，所以必须显式 `/bin/bash /scripts/...`。
  #
  # 参数 1 = DATA_RUN_ID（必填），参数 2 = RUN_ID（auto 则按 UTC 时间命名）。
  #
  # 调优参数为什么留在这里而不是脚本里：它们和下面的 rayClusterSpec 是一对，
  # 改集群规格就得同步改这几个数，放在同一个文件里才不会漂。
  #   集群真实预算：10 worker × num-cpus 2 = 20 个 Ray CPU
  #   --asr-actor-cpus 1 × --asr-actor-concurrency 16 = 占 16 个，留 4 个给
  #   下载 / LLM / Lance 写入。不要按 10×8=80 来配。
  # --------------------------------------------------------------------------
  entrypoint: >-
    /bin/bash /scripts/run-bench.sh
    REPLACE_WITH_DATA_RUN_ID
    auto
    --mock-url http://mock-llm:8010
    --ray-address auto
    --max-minutes 360
    --num-partitions 40
    --asr-actor-cpus 1
    --asr-actor-concurrency 16
    --asr-batch-size 1
    --llm-concurrency 16

  # 故意留空。原 30-submit-job.yaml 的注释解释了原因：镜像里的 submit.py
  # 在 Job runtime_env 里传 env_vars，而 pipeline.py 又把同一批 key 传给
  # ray.init()，Ray 2.55 会判定 runtime_env 冲突而拒绝。
  # 这里不设 runtimeEnvYAML，让 ray.init() 独占 worker 环境变量的所有权；
  # 依赖和模型都已烤进镜像，本来也不需要运行时分发。
  # runtimeEnvYAML: |
  #   env_vars: {}

  # --------------------------------------------------------------------------
  # 生命周期。这几个字段是 RayJob 相对 RayCluster 常驻的核心差异。
  # --------------------------------------------------------------------------
  # 作业终态后拆掉整个 RayCluster。基准测试要的就是干净环境，
  # 而 10 × 10Gi = 100Gi 空转太贵。
  # 想留现场排查就临时改成 false，代价是集群要手动删。
  shutdownAfterJobFinishes: true
  # 拆集群前保留 600s：够 kubectl logs 捞最后一段 driver 日志。
  # 产物本身不靠它兜底 —— run-bench.sh 已经推到 S3 了。
  ttlSecondsAfterFinished: 600
  # 整个作业的墙上时间上限，含集群拉起。与原 submit Job 的
  # activeDeadlineSeconds 一致（6h），由 16 个 ASR actor 抢 20 个 CPU 决定。
  activeDeadlineSeconds: 21600
  # 集群一直起不来（镜像拉不动、10 个 worker 排不下、readinessProbe 不过）
  # 就在 30min 后判 Failed，reason=PreRunningDeadlineExceeded，
  # 而不是干等到 activeDeadlineSeconds 的 6h。
  # 默认 0 表示不设限。常驻 RayCluster 没有这个概念 —— 它是 RayJob 独有的、
  # 排障提速最有效的一个开关。
  preRunningDeadlineSeconds: 1800
  # KubeRay 起一个 K8s Job 当提交器（官方默认值）。
  # 其他取值：HTTPMode / SidecarMode / InteractiveMode。
  # 必须是 K8sJobMode —— 只有它支持 submitterPodTemplate，
  # 我们要靠那个 template 插 wait-deps 探针。
  submissionMode: K8sJobMode
  # 作业级重试。0 = 失败不重试。注意每次重试都会新建一整个 RayCluster
  # 并重跑 entrypoint，基准测试自动重跑只会污染报表。
  backoffLimit: 0
  submitterConfig:
    # 提交器级重试，和上面那个 backoffLimit 不是一回事，默认值是 2 而不是 0。
    # 它只重试"提交"这个动作：KubeRay 用固定的 submission id 提交，
    # 重试会重连到已经在跑的那个 Ray job，而不是重跑作业。
    # 所以这里保留 2 是对的 —— 提交器 Pod 偶发被驱逐时不至于让 6h 的作业作废。
    backoffLimit: 2
  # 想做"成功就删 worker、集群再留 5 分钟"这类分阶段清理，用 deletionStrategy
  # （v1.6.0 beta），但它需要 operator 打开 RayJobDeletionPolicy feature gate，
  # 且与 shutdownAfterJobFinishes / ttlSecondsAfterFinished 互斥。
  # 基准场景不需要，这里不用。

  # --------------------------------------------------------------------------
  # 提交器 Pod。原 30-submit-job.yaml 的 wait-deps initContainer 搬到这里。
  #
  # 为什么还需要它：KubeRay 只等 RayCluster ready，不知道 MinIO 和 mock-llm
  # 的状态。少了这个探针，driver 会在 MinIO 还没起来时立刻去读 manifest 而失败。
  #
  # KubeRay 按**位置**认提交器：容器列表第一个就是提交器，名字随意
  # （官方 sample 的原话是 "the first container is assumed to be the
  # submitter container"）。所以 initContainer 可以随便加，
  # 但不能把别的业务容器排到 ray-job-submitter 前面。
  #
  # 不要自己写 command。留空时 KubeRay 会填上
  #   ray job submit --address=http://$RAY_DASHBOARD_ADDRESS \
  #                  --submission-id=$RAY_JOB_SUBMISSION_ID -- <entrypoint>
  # 这两个环境变量由 operator 注入。写死 command 就等于放弃 entrypoint 字段。
  # --------------------------------------------------------------------------
  submitterPodTemplate:
    metadata:
      labels:
        app: daft-audio-submitter
      annotations:
        kubectl.kubernetes.io/default-container: ray-job-submitter
    spec:
      restartPolicy: Never
      # imagePullSecrets:
      #   - name: offline-registry
      initContainers:
        - name: wait-deps
          image: daft-audio:offline
          imagePullPolicy: IfNotPresent
          # 只探 minio 和 mock。原版还探 ray / dashboard，在 RayJob 下必须去掉：
          # head Service 名是 <rayjob>-<random>-head-svc，写死探不到；
          # 而且 KubeRay 本来就已经等过集群 ready。
          command: ["/opt/venv/bin/python", "/scripts/wait.py", "minio", "mock"]
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      containers:
        - name: ray-job-submitter
          image: daft-audio:offline
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: scripts
          configMap: { name: bench-scripts }

  # --------------------------------------------------------------------------
  # 集群规格 —— 原 10-raycluster.yaml 的 spec 整体内联到这里。
  #
  # 内容基本原样搬过来，只有两处按 RayJob 形态调整（下面各自有注释）：
  #   1. head 增挂 /scripts（entrypoint 要用 run-bench.sh）
  #   2. worker 的硬性反亲和 / DoNotSchedule 放宽为 ScheduleAnyway
  #
  # 官方 KubeRay 配置要点（docs.ray.io cluster/kubernetes/user-guides/config）：
  #   - KubeRay 按容器 LIMITS 上报 CPU / memory / GPU，requests 被忽略。
  #     所以 request == limit（Guaranteed）。
  #   - 宁要少量大 Pod（一节点一个）。这里 10 × 2CPU / 10Gi 是节点能排下的
  #     规格，不要谎报 8 CPU。
  #   - rayStartParams 的值必须是字符串；CPU/GPU/memory 不要塞进
  #     rayStartParams.resources，用 num-cpus / num-gpus / memory。
  #   - 容器列表第一个必须是 Ray 容器。
  #
  # 内存三层，别重复扣减：
  #   1. resources.limits.memory  cgroup 上限（RSS + 实际 shm 占用）
  #   2. /dev/shm                 Plasma 所在的 tmpfs
  #   3. object-store-memory      Plasma 预留（字节）。KubeRay 不会替你填，
  #                               不填则 Ray 取可用内存的约 30%
  # KubeRay 1.6.2 会自动在 /dev/shm 注入 emptyDir.medium: Memory
  # （volume 名 shared-mem，sizeLimit = memory limit），除非已挂 /dev/shm
  # 或设了 plasma-directory。不要设 plasma-directory —— 那会跳过注入，
  # 退回容器默认的 64Mi。head 用默认（4Gi）；worker 覆盖成 3Gi，
  # 给 SenseVoice 的 RSS 留出 10Gi 里的约 7Gi。
  # --------------------------------------------------------------------------
  rayClusterSpec:
    rayVersion: "2.55.1"
    enableInTreeAutoscaling: false

    headGroupSpec:
      serviceType: ClusterIP
      rayStartParams:
        # 官方：把 dashboard 暴露到 Pod 外。所有值都是字符串。
        dashboard-host: "0.0.0.0"
        # 官方套路：让 head 不参与 Ray 调度，ASR actor 就永远不会落到
        # 这个 2 CPU 的 GCS/Jobs Pod 上。
        num-cpus: "0"
        disable-usage-stats: "true"
        # 把 Ray 内置的 Prometheus exporter 固定到稳定端口，
        # PodMonitor / ServiceMonitor 才不用去猜随机端口。
        metrics-export-port: "8080"
      template:
        metadata:
          labels:
            app: daft-audio-head
          # head 是单点（GCS + Jobs API）。挡掉 Cluster Autoscaler 的合并驱逐。
          # 没装 autoscaler 的集群上是空操作。
          annotations:
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        spec:
          # imagePullSecrets:
          #   - name: offline-registry
          containers:
            - name: ray-head
              image: daft-audio:offline
              imagePullPolicy: IfNotPresent
              ports:
                - { containerPort: 6379, name: gcs }
                - { containerPort: 8265, name: dashboard }
                - { containerPort: 10001, name: client }
                - { containerPort: 8080, name: metrics }
              envFrom:
                - configMapRef: { name: bench-env }
                - secretRef: { name: minio-creds }
              # 外部 Prometheus/Grafana 抓这个集群时，取消注释可以把图表
              # 嵌进 Dashboard 的 Metrics 页。地址必须从 head 可达。
              # env:
              #   - name: RAY_PROMETHEUS_HOST
              #     value: "http://prometheus.monitoring.svc:9090"
              #   - name: RAY_GRAFANA_HOST
              #     value: "http://grafana.monitoring.svc:3000"
              resources:
                # request == limit，让 KubeRay 上报的内存和 QoS 对得上。
                requests: { cpu: "2", memory: "4Gi" }
                limits: { cpu: "2", memory: "4Gi" }
              volumeMounts:
                # 这里不挂 /dev/shm：KubeRay 1.6.2 会注入 shared-mem（4Gi）。
                - { name: out, mountPath: /out }
                - { name: ray-logs, mountPath: /tmp/ray }
                # RayJob 形态新增：entrypoint 要执行 /scripts/run-bench.sh。
                # 常驻 RayCluster 不需要这个挂载，因为提交逻辑在外部 Job 里。
                - { name: scripts, mountPath: /scripts }
              # 用 Jobs API 真的能应答来把 head-svc 的 endpoint 放行，
              # 这正是 submit 依赖的东西。liveness 交给 KubeRay（它会注入
              # `ray health-check`）；对 dashboard 做 HTTP liveness 会因为
              # 偶发抖动重启 head。
              readinessProbe:
                httpGet: { path: /api/version, port: 8265 }
                initialDelaySeconds: 15
                periodSeconds: 5
                failureThreshold: 30
          volumes:
            # 临时产物目录。RayJob 形态下换成 PVC 也没意义 —— Pod 都要删。
            # 持久化靠 run-bench.sh 推 S3。
            - name: out
              emptyDir: {}
            - name: ray-logs
              emptyDir: {}
            - name: scripts
              configMap: { name: bench-scripts }

    workerGroupSpecs:
      - groupName: asr-workers
        # KubeRay 会把 replicas 夹到 [minReplicas, maxReplicas]，三者必须一致。
        # 关了 autoscaling 就不要把 maxReplicas 写成 100 —— 以后一开开关，
        # 它真会去调度 100 个 worker。
        #
        # 容量：10 Pod × (2 CPU, 10Gi) = 20 CPU / 100Gi。
        # 上面 entrypoint 的 actor 参数必须按这个数配。
        replicas: 10
        minReplicas: 10
        maxReplicas: 10
        rayStartParams:
          # 必须等于 resources.limits.cpu。Ray 调度器只看这个数字，
          # 真正约束运行的是 cgroup limit。
          num-cpus: "2"
          # Plasma 预留（字节）。KubeRay 不会替你填。
          # 必须小于下面 3Gi 的 shm 覆盖值。Ray 默认（10Gi 的约 30% ≈ 3Gi）
          # 会把 shm 顶满，一点余量都不剩。
          # 10k clip × 约 380KiB ≈ 3.6Gi，摊到 10 个 worker 上。
          object-store-memory: "2147483648"
          disable-usage-stats: "true"
          metrics-export-port: "8080"
        template:
          metadata:
            labels:
              app: daft-audio-worker
          spec:
            # imagePullSecrets:
            #   - name: offline-registry
            #
            # RayJob 形态放宽了调度约束。原 10-raycluster.yaml 用
            #   nodeSelector daft-bench/ray-worker=true
            #   + podAntiAffinity requiredDuringScheduling
            #   + topologySpread whenUnsatisfiable: DoNotSchedule
            # 来保证一节点一个 worker。常驻集群这样很好：排不下就 Pending，
            # 人工介入。
            #
            # 但 RayJob 会等集群 ready 才提交，任何一个 worker 排不下都会
            # 一路拖到 activeDeadlineSeconds 才失败，作业白等。
            # 所以这里改成软约束：尽量分散，排不下也先跑起来。
            #
            # 要严格独占节点（对比基准、要求可复现）就打开下面这段，
            # 并确保恰好 10 个节点打了标签：
            #   for n in node-01 ... node-10; do
            #     kubectl label node "$n" daft-bench/ray-worker=true --overwrite
            #   done
            # nodeSelector:
            #   daft-bench/ray-worker: "true"
            # affinity:
            #   podAntiAffinity:
            #     requiredDuringSchedulingIgnoredDuringExecution:
            #       - labelSelector:
            #           matchLabels:
            #             app: daft-audio-worker
            #         topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    app: daft-audio-worker
            containers:
              - name: ray-worker
                image: daft-audio:offline
                imagePullPolicy: IfNotPresent
                envFrom:
                  - configMapRef: { name: bench-env }
                  - secretRef: { name: minio-creds }
                ports:
                  # 命名端口，PodMonitor 才能按名字选。
                  - { containerPort: 8080, name: metrics }
                resources:
                  # request == limit（Guaranteed）。cpu 必须等于 num-cpus。
                  # 官方：KubeRay 忽略 memory request，保持两者相等。
                  requests: { cpu: "2", memory: "10Gi" }
                  limits: { cpu: "2", memory: "10Gi" }
                volumeMounts:
                  # 覆盖自动注入（否则 sizeLimit=10Gi）。
                  # 压住 shm，别让 Plasma/tmpfs 挤掉 SenseVoice 的 RSS。
                  - { name: dshm, mountPath: /dev/shm }
                  - { name: ray-logs, mountPath: /tmp/ray }
            volumes:
              # 实际 shm 占用是要算进 10Gi limit 的。3Gi shm = 2Gi Plasma
              # + 1Gi 余量。sizeLimit 是上限，不是预留。
              - name: dshm
                emptyDir: { medium: Memory, sizeLimit: 3Gi }
              - name: ray-logs
                emptyDir: {}
