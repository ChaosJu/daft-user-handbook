# ============================================================================
# RayJob smoke（自建镜像）—— 4GB / 2CPU 虚拟机
#
# 镜像：examples/docker/ 构建的 daft-ray-ops:2.55.1
# 运行期零 pip；比 10-rayjob-smoke.yaml 启动快得多。
# 构建与 k3s 导入见 ../docker/README.md
# ============================================================================
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: daft-quickstart-baked
  namespace: daft-quickstart
  labels:
    app.kubernetes.io/name: daft-quickstart-baked
    app.kubernetes.io/component: rayjob-smoke
spec:
  entrypoint: python /home/ray/samples/main.py

  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 120
  activeDeadlineSeconds: 900
  preRunningDeadlineSeconds: 900
  submissionMode: K8sJobMode
  backoffLimit: 0

  rayClusterSpec:
    rayVersion: "2.55.1"
    enableInTreeAutoscaling: false

    headGroupSpec:
      serviceType: ClusterIP
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
        disable-usage-stats: "true"
        metrics-export-port: "8080"
        object-store-memory: "78643200"
      template:
        metadata:
          labels:
            app: daft-quickstart-baked-head
        spec:
          containers:
            - name: ray-head
              image: daft-ray-ops:2.55.1
              imagePullPolicy: IfNotPresent
              ports:
                - { containerPort: 6379, name: gcs }
                - { containerPort: 8265, name: dashboard }
                - { containerPort: 10001, name: client }
                - { containerPort: 8080, name: metrics }
              resources:
                requests: { cpu: "200m", memory: "1536Mi" }
                limits: { cpu: "500m", memory: "2Gi" }
              volumeMounts:
                - { name: script, mountPath: /home/ray/samples }
                - { name: ray-logs, mountPath: /tmp/ray }
                - { name: shared-mem, mountPath: /dev/shm }
              readinessProbe:
                httpGet: { path: /api/version, port: 8265 }
                initialDelaySeconds: 60
                periodSeconds: 5
                failureThreshold: 60
          volumes:
            - name: script
              configMap:
                name: daft-quickstart-baked-script
                items:
                  - { key: main.py, path: main.py }
            - name: ray-logs
              emptyDir: {}
            - name: shared-mem
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi

    workerGroupSpecs:
      - groupName: daft-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          num-cpus: "1"
          object-store-memory: "78643200"
          disable-usage-stats: "true"
          metrics-export-port: "8080"
        template:
          metadata:
            labels:
              app: daft-quickstart-baked-worker
          spec:
            containers:
              - name: ray-worker
                image: daft-ray-ops:2.55.1
                imagePullPolicy: IfNotPresent
                ports:
                  - { containerPort: 8080, name: metrics }
                resources:
                  requests: { cpu: "500m", memory: "768Mi" }
                  limits: { cpu: "1", memory: "1Gi" }
                volumeMounts:
                  - { name: ray-logs, mountPath: /tmp/ray }
                  - { name: shared-mem, mountPath: /dev/shm }
            volumes:
              - name: ray-logs
                emptyDir: {}
              - name: shared-mem
                emptyDir:
                  medium: Memory
                  sizeLimit: 128Mi
