# ============================================================================
# 示例脚本 —— 依赖已烤进 daft-ray-ops 镜像，运行期不装任何东西
#
# 逻辑取自官方 Daft K8s 文档的 Distributed Mode 示例：
#   https://docs.daft.ai/en/stable/distributed/kubernetes/
#
# 与官方原文的两处差异，都是刻意的：
#
# 1. 去掉了 PEP 723 内联依赖块和 ray.init(runtime_env={"pip": ["daft"]})。
#    官方靠 `uv run --script` 给 driver 装 daft、靠 runtime_env 给 worker 装，
#    每次作业都要连 PyPI，离线不可用且 driver/worker 版本没有保证。
#    这里依赖在镜像里（见 ../docker/），直接 `python main.py` 就行。
#
# 2. 保留了 print(df.collect())。示例只有 6 行，看得见输出才好验证链路；
#    生产必须以 write_* 收尾，理由见 docs/03-best-practices/production-donts.md。
#
# 挂载点是 /home/ray/samples/main.py：镜像以 ray 用户运行（HOME=/home/ray）。
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: daft-quickstart
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daft-quickstart-script
  namespace: daft-quickstart
  labels:
    app.kubernetes.io/name: daft-quickstart
data:
  main.py: |
    import daft

    daft.set_runner_ray()

    df = daft.from_pydict({
        "a": [3, 2, 5, 6, 1, 4],
        "b": [True, False, False, True, True, False]
    })

    df = df.where(df["b"]).sort(df["a"])

    print(df.collect())
