# ============================================================================
# RayJob（自建镜像）—— daft-ray-ops，依赖烤进镜像
#
# 与 10-rayjob.yaml 同规格，但：
#   - 镜像 daft-ray-ops:2.55.1（见 ../docker/）
#   - entrypoint 直接 python，无 uv / runtime_env pip
#   - 离线可用（构建期联网一次即可）
# ============================================================================
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: daft-quickstart-baked
  namespace: daft-quickstart
  labels:
    app.kubernetes.io/name: daft-quickstart-baked
    app.kubernetes.io/component: rayjob
spec:
  entrypoint: python /home/ray/samples/main.py

  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 60
  activeDeadlineSeconds: 300
  preRunningDeadlineSeconds: 300
  submissionMode: K8sJobMode
  backoffLimit: 0

  rayClusterSpec:
    rayVersion: "2.55.1"
    enableInTreeAutoscaling: false

    headGroupSpec:
      serviceType: ClusterIP
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
        disable-usage-stats: "true"
        metrics-export-port: "8080"
      template:
        metadata:
          labels:
            app: daft-quickstart-baked-head
        spec:
          containers:
            - name: ray-head
              image: daft-ray-ops:2.55.1
              imagePullPolicy: IfNotPresent
              ports:
                - { containerPort: 6379, name: gcs }
                - { containerPort: 8265, name: dashboard }
                - { containerPort: 10001, name: client }
                - { containerPort: 8080, name: metrics }
              resources:
                requests: { cpu: "1", memory: "2Gi" }
                limits: { cpu: "1", memory: "2Gi" }
              volumeMounts:
                - { name: script, mountPath: /home/ray/samples }
                - { name: ray-logs, mountPath: /tmp/ray }
              readinessProbe:
                httpGet: { path: /api/version, port: 8265 }
                initialDelaySeconds: 10
                periodSeconds: 5
                failureThreshold: 30
          volumes:
            - name: script
              configMap:
                name: daft-quickstart-baked-script
                items:
                  - { key: main.py, path: main.py }
            - name: ray-logs
              emptyDir: {}

    workerGroupSpecs:
      - groupName: daft-workers
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams:
          num-cpus: "2"
          disable-usage-stats: "true"
          metrics-export-port: "8080"
        template:
          metadata:
            labels:
              app: daft-quickstart-baked-worker
          spec:
            containers:
              - name: ray-worker
                image: daft-ray-ops:2.55.1
                imagePullPolicy: IfNotPresent
                ports:
                  - { containerPort: 8080, name: metrics }
                resources:
                  requests: { cpu: "2", memory: "4Gi" }
                  limits: { cpu: "2", memory: "4Gi" }
                volumeMounts:
                  - { name: ray-logs, mountPath: /tmp/ray }
            volumes:
              - name: ray-logs
                emptyDir: {}
